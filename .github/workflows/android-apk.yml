name: Build NocTune APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    # Pinned: ubuntu-latest moves to a new Ubuntu release on 2026-10-19, which would
    # change the preinstalled Android SDK under this job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use the runner's Android SDK
        run: |
          set -uo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "No Android SDK found at $SDK_ROOT" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools"/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager is missing from $SDK_ROOT. Contents:" >&2
            ls -1 "$SDK_ROOT" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          installed=0
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"; then
              installed=1
              break
            fi
            echo "sdkmanager attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done
          if [ "$installed" -ne 1 ]; then
            echo "Could not install the Android SDK packages after 3 attempts." >&2
            exit 1
          fi
          ls -1 "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"
      - name: Install dependencies
        run: bun install
      - name: Check the build inputs
        run: |
          test -x node_modules/.bin/vite || { echo "vite is missing from node_modules" >&2; exit 1; }
          for f in src/assets/quiet-hours.mp3.asset.json src/assets/weightless.mp3.asset.json src/assets/afterglow.mp3.asset.json; do
            test -f "$f" || { echo "missing $f" >&2; exit 1; }
          done
      - name: Build and bundle offline player
        run: |
          set -uo pipefail
          log=/tmp/build.log
          ( bun run build && node scripts/prepare-android.mjs && bunx cap sync android ) >"$log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Build or packaging failed with exit $status. Last lines of output:"
            tail -n 60 "$log" | sed 's/%/%25/g; s/\r//g; s/[[:space:]]*$//' | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi
          tail -n 12 "$log"
      - name: Compile installable APK
        working-directory: android
        run: |
          set -uo pipefail
          log=/tmp/gradle.log
          chmod +x gradlew
          ( ./gradlew assembleDebug --no-daemon --stacktrace ) >"$log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Gradle failed with exit $status. Last lines of output:"
            tail -n 60 "$log" | sed 's/%/%25/g; s/\r//g; s/[[:space:]]*$//' | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi
          tail -n 12 "$log"
      - name: Upload NocTune APK
        uses: actions/upload-artifact@v4
        with:
          name: NocTune-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
