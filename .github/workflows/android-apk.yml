name: Build NocTune APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          SDK="$ANDROID_HOME"
          MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$MGR" --licenses >/dev/null 2>&1 || true
          "$MGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: bun install
      - name: Build web app
        run: bun run build
      - name: Bundle offline audio
        run: node scripts/prepare-android.mjs
      - name: Sync Android project
        run: bunx cap sync android
      - name: Compile installable APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload NocTune APK
        uses: actions/upload-artifact@v4
        with:
          name: NocTune-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
