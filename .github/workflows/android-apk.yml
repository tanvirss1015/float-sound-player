name: Build NocTune APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$MGR" --licenses >/dev/null 2>&1 || true
          "$MGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: bun install
      - name: Build web app
        env:
          LOVABLE_SANDBOX: "1"
        run: bun run build
      - name: Bundle offline audio
        run: node scripts/prepare-android.mjs 2>&1 | tee /tmp/b.log; exit ${PIPESTATUS[0]}
      - name: Report diagnostics
        if: failure()
        run: |
          echo "::error::bundle-log: $(tail -c 300 /tmp/b.log 2>/dev/null | tr '\n' '|')"
          echo "::error::dist-tree: $(find dist -maxdepth 2 2>/dev/null | tr '\n' '|')"
          echo "::error::asset-http: $(curl -s -o /dev/null -w '%{http_code}' https://float-sound-player.lovable.app/__l5e/assets-v1/7c425f11-bb83-48dd-b819-aca57fd5c9e6/quiet-hours.mp3)"
      - name: Sync Android project
        run: bunx cap sync android
      - name: Compile installable APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload NocTune APK
        uses: actions/upload-artifact@v4
        with:
          name: NocTune-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
